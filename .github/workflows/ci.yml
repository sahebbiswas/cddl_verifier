name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  version-bump:
    # Every pull request bumps src/cddl_verifier/_version.py by one SemVer
    # step (CONTRIBUTING.md, "Versioning"). The checkout is GitHub's test
    # merge commit, whose first parent is the tip of the base branch, so
    # depth 2 brings the base version along with no extra fetch.
    name: Version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
        persist-credentials: false

    - name: Compare with the base branch
      run: |
        if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
          echo "::error::Expected the pull request's test merge commit, found a single-parent commit"
          exit 1
        fi
        git show HEAD^1:src/cddl_verifier/_version.py > "$RUNNER_TEMP/base_version.py"
        python3 .github/scripts/check_version_bump.py "$RUNNER_TEMP/base_version.py" src/cddl_verifier/_version.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
        python -m build

    - name: Validate distribution metadata
      run: python -m twine check --strict dist/*

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  test:
    # The suite runs against the installed wheel or sdist, not the source
    # tree: CDDL_VERIFIER_REQUIRE_INSTALLED makes tests/conftest.py fail if
    # cddl_verifier would be imported from src/.
    name: Test ${{ matrix.artifact }} on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        artifact: [wheel]
        include:
        - python-version: '3.11'
          artifact: sdist

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Install the built package
      env:
        ARTIFACT: ${{ matrix.artifact }}
      run: |
        python -m pip install --upgrade pip
        if [ "$ARTIFACT" = wheel ]; then pkg=$(ls dist/*.whl); else pkg=$(ls dist/*.tar.gz); fi
        python -m pip install "$pkg" -r requirements.txt

    - name: Check the installed package and CLI
      # Run outside the checkout so nothing is imported from the source tree.
      working-directory: ${{ runner.temp }}
      run: |
        python -c "import cddl_verifier, sys; print(cddl_verifier.__version__, cddl_verifier.__file__); assert 'site-packages' in cddl_verifier.__file__"
        cddl-verify --help
        cddl-verify --version
        python -m cddl_verifier --version

    - name: Run unit tests against the installed package
      env:
        CDDL_VERIFIER_REQUIRE_INSTALLED: '1'
      run: pytest tests/ --junitxml=junit/test-results.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.artifact }}-py${{ matrix.python-version }}
        path: junit/test-results.xml
