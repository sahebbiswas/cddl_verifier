name: Publish to PyPI / TestPyPI

# Releases use PyPI Trusted Publishing (OIDC), so no API tokens are stored
# in the repository. One-time setup, on both pypi.org and test.pypi.org:
#   Project "cddl-verifier" -> Publishing -> add a GitHub trusted publisher
#     owner: sahebbiswas   repository: cddl_verifier
#     workflow: publish_pypi.yml
#     environment: pypi (on pypi.org) / testpypi (on test.pypi.org)
# and create the matching "pypi" and "testpypi" environments under
# Settings -> Environments (add required reviewers on "pypi" if wanted).
#
# Flow:
#   * Manual run (workflow_dispatch): build, check, smoke test, then publish
#     to TestPyPI only.
#   * GitHub release published (tag vX.Y.Z): build, check, smoke test,
#     publish to TestPyPI, verify the TestPyPI install, then publish to PyPI.
#     This is the only way to reach production PyPI.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Read package version
        id: meta
        run: |
          version=$(python - <<'PY'
          import glob, email.parser, zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              print(email.parser.Parser().parsestr(z.read(name).decode())["Version"])
          PY
          )
          echo "Package version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$VERSION'"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Smoke test ${{ matrix.artifact }} (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheel, sdist]
        python-version: ["3.9", "3.13"]
    steps:
      - name: Checkout code (test data only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install into a clean virtual environment
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$ARTIFACT" = wheel ]; then
            pkg=$(ls dist/*.whl)
          else
            pkg=$(ls dist/*.tar.gz)
          fi
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$pkg"

      - name: Exercise the installed package and CLI
        # Run outside the checkout so nothing is imported from the source tree.
        working-directory: ${{ runner.temp }}
        env:
          SRC: ${{ github.workspace }}
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          cddl-verify --help
          cddl-verify --version
          cddl-verify "$SRC/cddl-schemas/example_iana.cddl" \
                      "$SRC/test-data/example_iana.cbor" \
                      --type message --output example_iana.edn
          test -s example_iana.edn
          python - <<'PY'
          import os
          from pathlib import Path
          import cddl_verifier
          from cddl_verifier import Validator, validate
          from cddl_verifier.cbor import decode, encode

          assert "site-packages" in cddl_verifier.__file__, cddl_verifier.__file__
          src = Path(os.environ["SRC"])
          schema = src / "cddl-schemas" / "example_iana.cddl"
          data = (src / "test-data" / "example_iana.cbor").read_bytes()
          result = validate(schema, data, root_type="message")
          assert result.valid, result.errors
          assert decode(encode(result.data)) == result.data
          assert "/ message /" in Validator(schema).to_edn(data)
          assert not validate("n = uint", encode("x")).valid
          print("cddl_verifier", cddl_verifier.__version__, "OK")
          PY

      - name: Run unit tests against the installed package
        env:
          CDDL_VERIFIER_REQUIRE_INSTALLED: "1"
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, smoke-test]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cddl-verifier/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI never allows re-uploading a version; re-runs should not fail.
          skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI install
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from TestPyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          # The new upload can take a moment to appear in the index.
          for attempt in 1 2 3 4 5 6; do
            if "$RUNNER_TEMP/venv/bin/python" -m pip install --no-cache-dir \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "cddl-verifier==$VERSION"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          "$RUNNER_TEMP/venv/bin/cddl-verify" --version
          "$RUNNER_TEMP/venv/bin/python" -c "import cddl_verifier; print(cddl_verifier.__version__)"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, smoke-test, verify-testpypi]
    # Only a published release reaches production PyPI, and only after the
    # TestPyPI upload and install check have succeeded.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cddl-verifier/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
