[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cddl-verifier"
dynamic = ["version"]
description = "Validate CBOR data against CDDL schemas, generate annotated EDN, and convert CBOR/JSON"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["cbor", "cddl", "edn", "rfc8610", "rfc8949", "corim", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
# No runtime dependencies: CBOR encoding and decoding are bundled.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/sahebbiswas/cddl_verifier"
Source = "https://github.com/sahebbiswas/cddl_verifier"
Issues = "https://github.com/sahebbiswas/cddl_verifier/issues"
"Release notes" = "https://github.com/sahebbiswas/cddl_verifier/releases"

[project.scripts]
cddl-verify = "cddl_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "cddl_verifier._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Show short traceback, suppress noisy logger output during tests
log_cli = false
addopts = "--tb=short -q"
